version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - misspell
  settings:
    revive:
      # Defaults only; exported-identifier comments are checked by review.
      severity: warning
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
